<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprechstunden-Status</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
        }
        h1 {
            color: #333;
            margin-bottom: 2rem;
        }
        .status-container {
            display: flex;
            gap: 1.5rem;
        }
        .btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .frei {
            background-color: #34c759;
            color: white;
        }
        .besetzt {
            background-color: #ff3b30;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Sprechstunden-Status</h1>

    <div class="status-container">
        <button class="btn frei">Frei / Bitte eintreten</button>
        <button class="btn besetzt">Besetzt / Bitte warten</button>
    </div>

</body>
</html>
