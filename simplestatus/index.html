<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprechstunden-Status</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 90%;
            width: 400px;
        }
        h1 {
            font-size: 2.8rem;
            margin: 0 0 1rem 0;
            word-wrap: break-word;
        }
        p {
            font-size: 1.4rem;
            margin: 0;
            opacity: 0.9;
        }
        .bg-frei { background-color: #28a745; }
        .bg-besetzt { background-color: #dc3545; }
    </style>
</head>
<body class="bg-frei" id="body">

    <div class="status-card">
        <h1 id="status-title">FREI</h1>
        <p id="status-text">Bitte eintreten</p>
    </div>

    <script>
        async function checkStatus() {
            try {
                const res = await fetch('/api/get-status');
                const data = await res.json();
                const body = document.getElementById('body');
                const title = document.getElementById('status-title');
                const text = document.getElementById('status-text');

                if (data.status === 'frei') {
                    body.className = 'bg-frei';
                    title.innerText = 'FREI';
                    text.innerText = 'Bitte eintreten';
                } else {
                    body.className = 'bg-besetzt';
                    title.innerText = 'BESETZT';
                    text.innerText = 'Bitte warten';
                }
            } catch (err) {
                console.error('Fehler beim Abrufen des Status:', err);
            }
        }

        checkStatus();
        setInterval(checkStatus, 3000); // Alle 3 Sekunden automatisch aktualisieren
    </script>
</body>
</html>
