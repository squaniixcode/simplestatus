<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚪</text></svg>">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
            text-align: center;
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px;
        }

        /* Frosted Glass Logo Platte oben zentriert */
        .logo-header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 28px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-header .logo {
            height: 4.5rem;
            width: auto;
            max-width: 80vw;
            object-fit: contain;
            display: block;
        }

        /* Frosted Glass Button unten zentriert */
        .admin-link {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;

            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        .admin-link:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateX(-50%) scale(1.03);
        }

        .bg-frei {
            background-color: #34c759;
        }
        .bg-besetzt {
            background-color: #ff3b30;
        }
        .bg-loading {
            background-color: #8e8e93;
        }
        .status-box {
            animation: fadeIn 0.5s ease;
        }
        h1 {
            font-size: 13vw;
            margin: 0;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            text-transform: uppercase;
        }
        p {
            font-size: 4vw;
            margin-top: 10px;
            font-weight: 500;
            opacity: 0.9;
        }
        @media (min-width: 768px) {
            h1 { font-size: 6rem; }
            p { font-size: 2rem; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body id="main-body" class="bg-loading">

    <!-- Frosted Glass Logo-Platte oben am Bildschirmrand -->
    <div class="logo-header">
        <img src="./logo.png" alt="Logo" class="logo">
    </div>

    <div class="status-box">
        <h1 id="status-title">LADE...</h1>
        <p id="status-text">Verbindung wird aufgebaut</p>
    </div>

    <!-- Frosted Glass Button unten -->
    <a href="https://simplestatus-virid.vercel.app/admin.html" class="admin-link">Status falsch?</a>

    <script>
        async function checkStatus() {
            // Keine Anfrage senden, wenn der Bildschirm/Tab nicht aktiv sichtbar ist
            if (document.hidden) {
                return;
            }

            try {
                const res = await fetch('/api/get-status');
                const data = await res.json();
                
                const body = document.getElementById('main-body');
                const title = document.getElementById('status-title');
                const text = document.getElementById('status-text');

                if (data.status === 'frei') {
                    body.className = 'bg-frei';
                    title.innerText = 'Keine Patienten anwesend.';
                    text.innerText = 'Die Praxis ist frei.';
                } else {
                    body.className = 'bg-besetzt';
                    title.innerText = 'PATIENT*IN ANWESEND';
                    text.innerText = 'Bitte leise sein!';
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Sofort abfragen, wenn das Display wieder eingeschaltet oder die Seite geöffnet wird
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                checkStatus();
            }
        });

        checkStatus();
        setInterval(checkStatus, 10000); // Alle 10 Sekunden abfragen
    </script>
</body>
</html>
