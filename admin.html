<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Status Anzeige</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Status">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
       body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    color: #1c1c1e;

    /* Hintergrundbild einbinden */
    background-image: url('hintergrund.jpg');
    background-size: cover;          /* Blesst das Bild auf den ganzen Bildschirm */
    background-position: center;     /* Zentriert das Bild */
    background-repeat: no-repeat;    /* Verhindert Kacheln */
    background-attachment: fixed;    /* Fixiert das Bild beim Scrollen */
}

/* Optional: Die Karte leicht transparent machen (Glassmorphism) */
.card {
    background: rgba(255, 255, 255, 0.85); /* 85% weiß */
    backdrop-filter: blur(12px);            /* Weichzeichner dahinter */
    -webkit-backdrop-filter: blur(12px);
    padding: 2.5rem 2rem;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    width: 100%;
    max-width: 380px;
    text-align: center;
}
        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.2rem 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #8e8e93;
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0 0 2rem 0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .status-badge {
            display: inline-block;
            font-size: 1.05rem;
            font-weight: 600;
            padding: 0.7rem 1.4rem;
            border-radius: 30px;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }
        .status-frei { background-color: #e4f9e8; color: #248a3d; }
        .status-besetzt { background-color: #fde8e8; color: #d70015; }
        .status-loading { background-color: #e5e5ea; color: #8e8e93; }

        .toggle-btn {
            width: 100%;
            padding: 1.5rem 1rem;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .toggle-btn:active {
            transform: scale(0.96);
        }
        .btn-to-besetzt {
            background-color: #ff3b30;
        }
        .btn-to-frei {
            background-color: #34c759;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Patientometer 1.0</h1>
        <div class="subtitle">by Matthias Leppert</div>

        <div id="status-badge" class="status-badge status-loading">Lade Status...</div>

        <button id="toggle-btn" class="toggle-btn btn-to-besetzt" onclick="toggleStatus()">
            Wird geladen...
        </button>
    </div>

    <script>
        let currentStatus = 'frei';

        async function fetchStatus() {
            try {
                const res = await fetch('/api/get-status');
                const data = await res.json();
                currentStatus = data.status;
                updateUI(currentStatus);
            } catch (err) {
                console.error(err);
            }
        }

        function updateUI(status) {
            const badge = document.getElementById('status-badge');
            const btn = document.getElementById('toggle-btn');

            if (status === 'frei') {
                badge.innerText = 'Aktuell: FREI';
                badge.className = 'status-badge status-frei';
                
                btn.innerText = 'Patienten anwesend';
                btn.className = 'toggle-btn btn-to-besetzt';
            } else {
                badge.innerText = 'Aktuell: PATIENT VORHANDEN';
                badge.className = 'status-badge status-besetzt';
                
                btn.innerText = 'Keine Patienten mehr anwesend';
                btn.className = 'toggle-btn btn-to-frei';
            }
        }

        async function toggleStatus() {
            const nextStatus = (currentStatus === 'frei') ? 'besetzt' : 'frei';
            
            const badge = document.getElementById('status-badge');
            badge.innerText = 'Speichere...';
            badge.className = 'status-badge status-loading';
            
            try {
                await fetch('/api/set-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: nextStatus })
                });
                fetchStatus();
            } catch (err) {
                alert('Fehler beim Speichern');
                fetchStatus();
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 3000);
    </script>
</body>
</html>
